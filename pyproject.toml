[project]
name = "mimo-island"
version = "1.0.0"
description = "MiMo Token 灵动岛悬浮窗 - 实时监控 API 用量"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ctooc" }
]
keywords = ["mimo", "token", "monitor", "dynamic-island", "floating-widget"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
]

[project.scripts]
mimo-island = "mimo_island.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimo_island"]
