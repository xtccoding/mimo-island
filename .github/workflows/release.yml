name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .
      
      - name: Build with PyInstaller
        run: pyinstaller mimo-island.spec --clean
      
      - name: Check exe size
        run: |
          $size = (Get-Item dist\MiMo-Island.exe).Length / 1MB
          Write-Host "Exe size: $([math]::Round($size, 2)) MB"
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist\MiMo-Island.exe

  build-cpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Build
        run: |
          mkdir cpp\build
          cd cpp\build
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build .
      
      - name: Prepare release files
        run: |
          mkdir release
          copy cpp\build\MiMoIsland.exe release\
          $qtDir = "${{ env.Qt6_DIR }}"
          if (-not $qtDir) { $qtDir = "${{ env.QT_ROOT_DIR }}" }
          if (-not $qtDir) { $qtDir = "${{ runner.Qt_ROOT_DIR }}" }
          copy "$qtDir\bin\Qt6Core.dll" release\
          copy "$qtDir\bin\Qt6Gui.dll" release\
          copy "$qtDir\bin\Qt6Widgets.dll" release\
          copy "$qtDir\bin\Qt6Network.dll" release\
          copy "$qtDir\bin\Qt6Svg.dll" release\
          mkdir release\platforms
          copy "$qtDir\plugins\platforms\qwindows.dll" release\platforms\
          mkdir release\tls
          copy "$qtDir\plugins\tls\qopensslbackend.dll" release\tls\
          copy "$qtDir\plugins\tls\qschannelbackend.dll" release\tls\
      
      - name: Create zip
        run: Compress-Archive -Path release\* -DestinationPath MiMoIsland-CPP.zip
      
      - name: Upload CPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows
          path: MiMoIsland-CPP.zip

  release:
    needs: [build-windows, build-cpp]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/MiMo-Island.exe
            artifacts/cpp-windows/MiMoIsland-CPP.zip
          generate_release_notes: true
