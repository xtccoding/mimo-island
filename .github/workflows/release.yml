name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -e .
      
      - name: Generate ICO icon
        run: |
          python -c "
          from PIL import Image, ImageDraw
          
          size = 256
          img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          
          # Background rounded rect
          draw.rounded_rectangle([0, 0, size-1, size-1], radius=56, fill=(14, 14, 20, 255))
          
          # X shape (simplified from SVG)
          pts = [
            (64, 72), (112, 72), (112, 72),
            (112, 72), (160, 128), (160, 128),
            (160, 128), (216, 72), (216, 72),
            (248, 72), (176, 160), (176, 160),
            (176, 160), (248, 264), (248, 264),
            (208, 264), (160, 192), (160, 192),
            (160, 192), (112, 264), (112, 264),
            (64, 264), (144, 168), (144, 168),
          ]
          
          # Draw gradient-like X
          for i in range(0, len(pts)-1, 2):
            x1, y1 = pts[i]
            x2, y2 = pts[i+1]
            r = int(70 + (34-70) * (i/len(pts)))
            g = int(140 + (211-140) * (i/len(pts)))
            b = int(255 + (238-255) * (i/len(pts)))
            draw.line([(x1, y1), (x2, y2)], fill=(r, g, b, 255), width=20)
          
          # Generate ICO
          sizes = [(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)]
          img.save('assets/icon.ico', format='ICO', sizes=sizes)
          print('ICO generated successfully')
          "
      
      - name: Build exe with PyInstaller
        run: pyinstaller mimo-island.spec
      
      - name: Check exe size
        run: |
          $size = (Get-Item dist/MiMo-Island.exe).Length / 1MB
          Write-Host "Exe size: $([math]::Round($size, 2)) MB"
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/MiMo-Island.exe

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Build package
        run: python -m build
      
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  release:
    needs: [build-windows, build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/MiMo-Island.exe
            artifacts/python-package/*
          generate_release_notes: true
