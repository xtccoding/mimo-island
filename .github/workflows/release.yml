name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            .venv
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          pip install -e .
      
      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: build\mimo-island
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('src/**/*.py', 'mimo-island.spec') }}
          restore-keys: ${{ runner.os }}-pyinstaller-
      
      - name: Generate icon
        run: python build.py assets/icon_mimo.png
      
      - name: Build with PyInstaller
        run: pyinstaller mimo-island.spec --clean
      
      - name: Check exe size
        run: |
          $size = (Get-Item dist\MiMo-Island.exe).Length / 1MB
          Write-Host "Exe size: $([math]::Round($size, 2)) MB"
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist\MiMo-Island.exe

  build-cpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: ${{ runner.os }}-qt-6.7.0-msvc2019_64
      
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: ${{ runner.temp }}/qt
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: cpp\build
          key: ${{ runner.os }}-cmake-${{ hashFiles('cpp/src/**', 'cpp/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-cmake-
      
      - name: Build
        run: |
          if (-not (Test-Path cpp\build)) { mkdir cpp\build }
          cd cpp\build
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build .
      
      - name: Prepare release files
        run: |
          mkdir release -ErrorAction SilentlyContinue
          copy cpp\build\MiMoIsland.exe release\
          $qtDir = "${{ env.Qt6_DIR }}"
          if (-not $qtDir) { $qtDir = "${{ env.QT_ROOT_DIR }}" }
          if (-not $qtDir) { $qtDir = "${{ runner.temp }}\qt\6.7.0\msvc2019_64" }
          copy "$qtDir\bin\Qt6Core.dll" release\
          copy "$qtDir\bin\Qt6Gui.dll" release\
          copy "$qtDir\bin\Qt6Widgets.dll" release\
          copy "$qtDir\bin\Qt6Network.dll" release\
          copy "$qtDir\bin\Qt6Svg.dll" release\
          mkdir release\platforms -ErrorAction SilentlyContinue
          copy "$qtDir\plugins\platforms\qwindows.dll" release\platforms\
          mkdir release\tls -ErrorAction SilentlyContinue
          copy "$qtDir\plugins\tls\qopensslbackend.dll" release\tls\
          copy "$qtDir\plugins\tls\qschannelbackend.dll" release\tls\
          $qtRoot = Split-Path (Split-Path $qtDir)
          $sslDlls = Get-ChildItem $qtRoot -Recurse -Filter "libssl-3-x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sslDlls) { copy $sslDlls.FullName release\ }
          $cryptoDlls = Get-ChildItem $qtRoot -Recurse -Filter "libcrypto-3-x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cryptoDlls) { copy $cryptoDlls.FullName release\ }
      
      - name: Create zip
        run: Compress-Archive -Path release\* -DestinationPath MiMoIsland-CPP.zip
      
      - name: Upload CPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows
          path: MiMoIsland-CPP.zip

  release:
    needs: [build-windows, build-cpp]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/MiMo-Island.exe
            artifacts/cpp-windows/MiMoIsland-CPP.zip
          generate_release_notes: true
