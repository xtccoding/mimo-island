name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow cairosvg
          pip install -e .
      
      - name: Generate ICO from SVG
        run: |
          python -c "
          import cairosvg
          from PIL import Image
          import io
          
          # Convert SVG to PNG
          png_data = cairosvg.svg2png(url='assets/icon.svg', output_width=256, output_height=256)
          img = Image.open(io.BytesIO(png_data))
          
          # Generate ICO with multiple sizes
          sizes = [(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)]
          img.save('assets/icon.ico', format='ICO', sizes=sizes)
          print('ICO generated successfully')
          "
      
      - name: Build exe with PyInstaller
        run: pyinstaller mimo-island.spec
      
      - name: Check exe size
        run: |
          $size = (Get-Item dist/MiMo-Island.exe).Length / 1MB
          Write-Host "Exe size: $([math]::Round($size, 2)) MB"
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/MiMo-Island.exe

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Build package
        run: python -m build
      
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  release:
    needs: [build-windows, build-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/MiMo-Island.exe
            artifacts/python-package/*
          generate_release_notes: true
