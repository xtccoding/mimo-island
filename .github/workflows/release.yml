name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set
          pip install -e .
      
      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --windows-disable-console `
            --output-filename=MiMo-Island.exe `
            --include-package=PySide6 `
            --include-package=requests `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=unittest `
            --nofollow-import-to=test `
            --assume-yes-for-downloads `
            src/mimo_island/main.py
      
      - name: Check exe size
        run: |
          $size = (Get-Item MiMo-Island.exe).Length / 1MB
          Write-Host "Exe size: $([math]::Round($size, 2)) MB"
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: MiMo-Island.exe

  build-cpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
      
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Build
        run: |
          mkdir cpp\build
          cd cpp\build
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
      
      - name: Prepare release files
        run: |
          mkdir release
          copy cpp\build\MiMoIsland.exe release\
          copy cpp\build\Qt6Core.dll release\
          copy cpp\build\Qt6Gui.dll release\
          copy cpp\build\Qt6Widgets.dll release\
          copy cpp\build\Qt6Network.dll release\
          copy cpp\build\Qt6Svg.dll release\
          mkdir release\platforms
          copy cpp\build\platforms\qwindows.dll release\platforms\
          mkdir release\tls
          copy cpp\build\tls\qopensslbackend.dll release\tls\
          copy cpp\build\tls\qschannelbackend.dll release\tls\
      
      - name: Create zip
        run: Compress-Archive -Path release\* -DestinationPath MiMoIsland-CPP.zip
      
      - name: Upload CPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-windows
          path: MiMoIsland-CPP.zip

  release:
    needs: [build-windows, build-cpp]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-exe/MiMo-Island.exe
            artifacts/cpp-windows/MiMoIsland-CPP.zip
          generate_release_notes: true
